[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-base"
version = "0.1.0"
description = "Minimal Flask library for quickly creating web apps with Firestore, authentication, and GCP deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Note: Using text format for compatibility. Modern format would be: license = "MIT"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["flask", "firestore", "gcp", "authentication", "web-framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "Flask>=3.0.0",
    "Flask-Limiter>=3.5.0",
    "google-cloud-firestore>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/flask-base"
Documentation = "https://github.com/yourusername/flask-base#readme"
Repository = "https://github.com/yourusername/flask-base"

[tool.setuptools]
packages = ["flask_base"]

[tool.setuptools.package-data]
flask_base = ["templates/**/*.html"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["flask_base"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
pretty = true


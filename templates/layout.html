{% extends "base.html" %}

{% block nav_trailing %}
<style>
    #streak-indicator {
        display: inline-block;
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        font-size: 1.35rem;
        line-height: 1;
        vertical-align: middle;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.2s, opacity 0.2s, filter 0.2s;
    }

    #streak-indicator:hover {
        transform: scale(1.1);
    }

    @keyframes ct-wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
    }

    #streak-indicator.below-minimum {
        animation: ct-streak-pulse 2s ease-in-out infinite;
    }

    #streak-indicator.below-you {
        filter: hue-rotate(10deg) saturate(1.5) brightness(1.1);
    }

    #streak-indicator.below-spouse {
        filter: hue-rotate(200deg) saturate(1.3);
    }

    #streak-indicator.below-both {
        filter: hue-rotate(-40deg) saturate(1.6) brightness(1.05);
    }

    @keyframes ct-streak-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.75; }
    }
</style>
<div id="streak-indicator" class="streak-indicator" style="display: none;" role="button" tabindex="0" data-action="navigate" data-url="/stats" aria-label="Streak status">🔥</div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/cloudtasks-shell.js"></script>
    <script type="module" src="/static/js/utils.js"></script>
    {{ super() }}
{% endblock %}

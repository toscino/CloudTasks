runtime: python311

env: standard

entrypoint: gunicorn -b :$PORT app:app

automatic_scaling:
  min_instances: 1
  max_instances: 2
  target_cpu_utilization: 0.8
  min_idle_instances: 0
  max_idle_instances: 0

env_variables:
  GOOGLE_CLOUD_PROJECT: cloudtasks-app-473120
  FLASK_ENV: development
  # flask_base required variables
  FLASK_SECRET: JECM3x7UynZt
  ADMIN_KEY: MQQYPDMC6QRr
  FLASK_BASE_KEY_PREFIX: CT_KEY_
  # flask_base auth keys (format: CT_KEY_USERNAME=user_key:permissions)
  # Username extracted from env var name (underscores become spaces)
  # User provides the actual key value in ?key= parameter
  CT_KEY_IAN: dev-user1-secret-key
  CT_KEY_KARLEIGH: dev-user2-secret-key
  CT_KEY_USER3: dev-user3-secret-key

handlers:
- url: /.*
  script: auto

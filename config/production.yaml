runtime: python311

env: standard

entrypoint: gunicorn -b :$PORT app:app

automatic_scaling:
  min_instances: 2
  max_instances: 20

env_variables:
  GOOGLE_CLOUD_PROJECT: cloudtasks-app-473120
  FLASK_ENV: production
  FLASK_SECRET: your-production-flask-secret-key-change-this
  ADMIN_KEY: your-production-admin-key-change-this
  FLASK_BASE_KEY_PREFIX: CT_KEY_
  USER1_SECRET_KEY: your-production-user1-secret-key-change-this
  USER2_SECRET_KEY: your-production-user2-secret-key-change-this
  USER3_SECRET_KEY: your-production-user3-secret-key-change-this

handlers:
- url: /.*
  script: auto
